  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

erif:'Spectral',serif;\n  --sans:'Public Sans',system-ui,sans-serif;\n}\n\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{\n  margin:0;\n  background:var(--bg);\n  color:var(--text);\n  font-family:var(--sans);\n  -webkit-font-smoothing:antialiased;\n}\na{color:inherit;text-decoration:none}\na:hover{color:var(--accent)}\nimg{display:block;max-width:100%}\n::selection{background:var(--accent);color:var(--bg)}\n\n/* ---------- pomoćne klase ---------- */\n.section{padding:80px 44px;border-top:1px solid var(--line)}\n.kicker{font-size:12px;letter-spacing:.18em;color:var(--accent);margin-bottom:12px}\n.h2{font-family:var(--serif);font-weight:600;font-size:42px;margin:0;letter-spacing:-.01em}\n.center{text-align:center}\n.section-head{text-align:center;margin-bottom:48px}\n\n/* ---------- NAVIGACIJA ---------- */\n.nav{\n  position:sticky;top:0;z-index:50;\n  display:flex;align-items:center;justify-content:space-between;\n  padding:16px 44px;\n  background:rgba(20,19,15,.82);backdrop-filter:blur(14px);\n  border-bottom:1px solid var(--line);\n}\n.nav__logo{display:flex;align-items:center;gap:13px}\n.nav__logo-shine{position:relative;display:inline-block;overflow:hidden;border-radius:6px}\n.nav__logo-shine::after{\n  content:'';position:absolute;top:0;left:-75%;width:45%;height:100%;\n  background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);\n  transform:skewX(-22deg);animation:logoShine 4s ease-in-out infinite;pointer-events:none;\n}\n.nav__logo img{height:50px;width:auto}\n.nav__links{display:flex;align-items:center;gap:19px;font-size:13.5px;white-space:nowrap;color:#cfc9bb}\n.nav__right{display:flex;align-items:center;gap:16px}\n.langswitch{display:flex;font-size:12px;border:1px solid rgba(242,239,230,.18);border-radius:999px;overflow:hidden}\n.langswitch span{display:inline-block;padding:6px 14px;line-height:1;cursor:pointer;transition:.2s;color:#cfc9bb}\n.langswitch span.is-active{background:var(--accent);color:var(--bg);font-weight:700}\n.btn-phone{\n  white-space:nowrap;padding:10px 18px;border:1px solid var(--accent);color:var(--accent);\n  border-radius:999px;font-size:13px;font-weight:600;\n  animation:phonePulse 2.4s ease-in-out infinite;transition:.2s;\n}\n.btn-phone:hover{background:var(--accent);color:var(--bg)}\n\n/* hamburger + mobilni meni (sakriveni na desktopu) */\n.hamburger{display:none;flex-direction:column;justify-content:center;align-items:center;gap:5px;width:44px;height:44px;border:1px solid rgba(242,239,230,.2);border-radius:10px;cursor:pointer}\n.hamburger span{display:block;width:22px;height:2px;background:var(--text);border-radius:2px;transition:transform .25s ease,opacity .25s ease;transform-origin:center}\n.hamburger.is-open span:nth-child(1){transform:translateY(7px) rotate(45deg)}\n.hamburger.is-open span:nth-child(2){opacity:0}\n.hamburger.is-open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}\n.mobilemenu{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:2px;padding:14px 18px 20px;background:rgba(16,15,12,.98);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-strong);box-shadow:0 22px 40px rgba(0,0,0,.5)}\n.mobilemenu.is-open{display:flex}\n.mobilemenu a{padding:14px 6px;font-size:16px;color:var(--text);border-bottom:1px solid rgba(242,239,230,.07)}\n.mobilemenu__foot{display:flex;align-items:center;gap:14px;margin-top:16px}\n.mobilemenu__foot .btn-call{flex:1;text-align:center;padding:12px 18px;background:var(--accent);color:var(--bg);border-radius:999px;font-size:14px;font-weight:700;animation:none}\n\n/* ---------- HERO ---------- */\n.hero{display:grid;grid-template-columns:1.05fr .95fr;background:var(--bg)}\n.hero__text{padding:100px 44px 96px;align-self:center}\n.hero__title{\n  font-family:var(--serif);font-weight:600;font-size:50px;line-height:1.04;margin:0 0 22px;letter-spacing:-.01em;\n  background:linear-gradient(100deg,var(--text) 0%,var(--text) 42%,var(--accent) 50%,var(--text) 58%,var(--text) 100%);\n  background-size:220% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;\n  animation:titleShine 5s ease-in-out infinite;\n}\n.hero__sub{font-size:18px;line-height:1.6;color:#c3bdae;max-width:480px;margin:0 0 36px}\n.hero__cta{display:flex;gap:14px}\n.btn{padding:15px 28px;border-radius:8px;font-weight:700;font-size:15px;transition:transform .25s ease,box-shadow .25s ease,background .25s ease,border-color .25s ease}\n.btn--primary{background:var(--accent);color:var(--bg)}\n.btn--primary:hover{background:var(--accent-hover);color:var(--bg);transform:translateY(-3px);box-shadow:0 14px 30px rgba(238,106,31,.4)}\n.btn--ghost{border:1px solid rgba(242,239,230,.25);color:var(--text);font-weight:600}\n.btn--ghost:hover{border-color:var(--accent);background:rgba(238,106,31,.08);transform:translateY(-3px);color:var(--text)}\n.hero__media{display:flex;align-items:center;justify-content:flex-end;padding:44px 47px 44px 12px}\n.hero__frame{position:relative;width:100%;max-width:540px;border-radius:18px;overflow:hidden;border:1px solid rgba(238,106,31,.35);box-shadow:0 26px 60px rgba(0,0,0,.55),0 0 0 6px rgba(238,106,31,.06);animation:heroFloat 6s ease-in-out infinite}\n.hero__frame img{width:100%;height:400px;object-fit:cover;object-position:center 16%}\n.hero__frame::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,19,15,.05) 0%,rgba(20,19,15,.35) 100%)}\n\n/* ---------- STATISTIKA TRAKA ---------- */\n.stats{overflow:hidden;background:var(--accent);border-top:1px solid rgba(20,19,15,.25);border-bottom:1px solid rgba(20,19,15,.25)}\n.stats__row{display:flex;justify-content:center;flex-wrap:wrap;width:100%}\n.stats__item{display:flex;align-items:baseline;gap:12px;padding:22px 40px;white-space:nowrap}\n.stats__num{font-family:var(--serif);font-size:34px;color:var(--bg);line-height:1}\n.stats__label{font-size:13px;color:#5a3512;letter-spacing:.04em;font-weight:600}\n\n/* ---------- KATEGORIJE ---------- */\n.cats__head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:40px}\n.cats__note{max-width:360px;font-size:14px;color:var(--muted);line-height:1.6;margin:0}\n.cats__grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}\n.cat{position:relative;padding:26px 22px;border-radius:14px;border:1px solid var(--line-strong);cursor:pointer;transition:transform .28s ease,border-color .28s ease,box-shadow .28s ease,background .28s ease}\n.cat--popular{border:1px solid rgba(238,106,31,.5);background:rgba(238,106,31,.06)}\n.cat:hover{transform:translateY(-8px) scale(1.02);border-color:var(--accent);box-shadow:0 22px 50px rgba(0,0,0,.5),0 0 0 1px rgba(238,106,31,.35);background:rgba(238,106,31,.09)}\n.cat__badge{position:absolute;top:-13px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:6px 16px;background:var(--accent);color:var(--bg);border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 6px 16px rgba(238,106,31,.35)}\n.cat__code{font-family:var(--serif);font-size:44px;color:var(--accent);line-height:1}\n.cat__name{font-weight:700;margin:12px 0 4px;font-size:17px}\n.cat__desc{font-size:13px;color:var(--muted);line-height:1.5;min-height:40px}\n.cat__price{margin-top:18px;padding-top:16px;border-top:1px solid var(--line-strong);display:flex;justify-content:space-between;align-items:baseline}\n.cat__price small{font-size:12px;color:var(--muted)}\n.cat__price b{font-family:var(--serif);font-size:22px;color:var(--text);font-weight:400}\n.cats__disclaimer{font-size:14px;color:var(--dim);margin-top:20px}\n\n/* ---------- O NAMA ---------- */\n.about{display:grid;grid-template-columns:.9fr 1.1fr;gap:0;border-top:1px solid var(--line)}\n.about__media{display:flex;align-items:center;padding:56px 24px 56px 44px}\n.about__frame{position:relative;width:100%;border-radius:16px;overflow:hidden;border:1px solid rgba(238,106,31,.25);box-shadow:0 20px 50px rgba(0,0,0,.5);transition:transform .35s ease,box-shadow .35s ease}\n.about__frame:hover{transform:translateY(-8px);box-shadow:0 30px 64px rgba(0,0,0,.6)}\n.about__frame img{width:100%;height:auto}\n.about__frame::after{content:'';position:absolute;top:0;left:-60%;width:38%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);animation:aboutShine 5.5s ease-in-out infinite;pointer-events:none}\n.about__body{align-self:center;padding:56px 44px 56px 24px}\n.about__body p{font-size:16px;line-height:1.7;color:#c3bdae;margin:0 0 18px}\n.about__list{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:12px}\n.about__list li{display:flex;align-items:center;gap:12px;font-size:15px}\n.about__list li::before{content:'✓';display:flex;align-items:center;justify-content:center;flex:none;width:24px;height:24px;border-radius:50%;background:rgba(238,106,31,.15);color:var(--accent);font-size:13px;font-weight:700}\n\n/* ---------- KAKO SE UPISATI ---------- */\n.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;max-width:1000px;margin:0 auto}\n.step-card{padding:34px 30px;border:1px solid var(--line-strong);border-radius:16px;background:var(--panel);transition:transform .28s ease,background-color .28s ease,border-color .28s ease,box-shadow .28s ease;cursor:pointer}\n.step-card:hover{background:var(--accent);border-color:var(--accent);transform:scale(1.03);box-shadow:0 22px 48px rgba(0,0,0,.5)}\n.step-card__num{font-family:var(--serif);font-size:40px;color:var(--accent);opacity:.5;line-height:1}\n.step-card:hover .step-card__num{color:var(--bg);opacity:1}\n.step-card__title{font-weight:700;font-size:19px;margin:14px 0 8px}\n.step-card__text{font-size:14px;line-height:1.6;color:var(--muted)}\n.step-card:hover .step-card__title,.step-card:hover .step-card__text{color:var(--bg)}\n.enroll-cta{text-align:center;margin-top:40px}\n\n/* ---------- PUT DO DOZVOLE ---------- */\n.journey{position:relative;max-width:1080px;margin:0 auto}\n.journey__line-bg{position:absolute;top:28px;left:7.1%;right:7.1%;height:3px;background:rgba(238,106,31,.18);border-radius:2px}\n.journey__line-fill{position:absolute;top:28px;left:7.1%;width:0;height:3px;background:var(--accent);border-radius:2px;animation:lineFill 3.85s ease-in-out infinite}\n.journey__steps{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:8px}\n.journey__step{text-align:center}\n.journey__circle{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:24px;font-weight:700;position:relative;z-index:1;margin:0 auto;animation:stepPulse 3.85s ease-in-out infinite}\n.journey__title{font-weight:700;font-size:15px;margin:16px 0 6px}\n.journey__text{font-size:12.5px;color:var(--muted);line-height:1.5}\n\n/* ---------- INSTRUKTORI ---------- */\n.inst__grid{display:flex;flex-wrap:wrap;gap:24px;justify-content:center}\n.inst{width:260px}\n.inst__photo{position:relative;height:250px;border-radius:12px;overflow:hidden;margin-bottom:16px;border:1px solid var(--line);background:#0e0d0a;transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease}\n.inst__photo:hover{transform:translateY(-8px);border-color:rgba(238,106,31,.55);box-shadow:0 20px 44px rgba(0,0,0,.5)}\n.inst__photo img{width:100%;height:100%;object-fit:cover;object-position:center top}\n.inst__photo img.zoom{transform:scale(1.06);transform-origin:center top}\n.inst__name{font-weight:700;font-size:16px}\n.inst__role{font-size:13px;color:var(--accent);margin:3px 0 6px}\n.inst__exp{font-size:13px;color:var(--muted)}\n\n/* ---------- UTISCI ---------- */\n.reviews__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;max-width:1080px;margin:0 auto}\n.review{padding:30px 28px;border:1px solid var(--line-strong);border-radius:14px;display:flex;flex-direction:column;gap:18px;transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease,background .3s ease}\n.review:hover{transform:translateY(-6px);border-color:rgba(238,106,31,.5);box-shadow:0 16px 40px rgba(0,0,0,.4);background:rgba(238,106,31,.04)}\n.review__stars{color:var(--accent);font-size:16px;letter-spacing:3px}\n.review__quote{font-family:var(--serif);font-size:18px;line-height:1.55;color:var(--text);margin:0;flex:1}\n.review__foot{display:flex;align-items:center;gap:12px;padding-top:6px;border-top:1px solid var(--line-strong)}\n.avatar{width:38px;height:38px;border-radius:50%;background:rgba(238,106,31,.15);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}\n.review__name{font-weight:700;font-size:14px}\n.review__cat{font-size:12px;color:var(--muted)}\n.reviews__cta{text-align:center;margin-top:40px}\n\n/* ---------- FAQ ---------- */\n.faq__grid{max-width:960px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}\n.faq-item{padding:22px 26px;border:1px solid var(--line-strong);border-radius:14px;cursor:pointer;transition:border-color .25s ease,background .25s ease}\n.faq-item.is-open{border-color:rgba(238,106,31,.5);background:rgba(238,106,31,.05)}\n.faq-item__q{display:flex;justify-content:space-between;align-items:center;gap:16px}\n.faq-item__q span{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--text)}\n.faq-item__icon{font-family:var(--serif);font-size:26px;color:var(--accent);line-height:1;flex-shrink:0;transition:transform .25s ease}\n.faq-item.is-open .faq-item__icon{transform:rotate(45deg)}\n.faq-item__a{overflow:hidden;max-height:0;opacity:0;transition:max-height .3s ease,opacity .25s ease}\n.faq-item.is-open .faq-item__a{max-height:200px;opacity:1}\n.faq-item__a p{margin:14px 0 0;font-size:15px;line-height:1.6;color:#c3bdae}\n\n/* ---------- GALERIJA ---------- */\n.gallery{max-width:680px;margin:0 auto;position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line-strong);box-shadow:0 26px 60px rgba(0,0,0,.45);aspect-ratio:16/9;background:#0c0b08}\n.gallery__slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s ease;opacity:0}\n.gallery__slide.is-active{opacity:1}\n.gallery__dots{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:10px;z-index:2}\n.gallery__dot{width:9px;height:9px;border-radius:50%;cursor:pointer;transition:background .3s ease,transform .3s ease;background:rgba(242,239,230,.45)}\n.gallery__dot.is-active{background:var(--accent);transform:scale(1.25)}\n\n/* ---------- ZAŠTO BAŠ MI ---------- */\n.why__grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;max-width:1080px;margin:0 auto}\n.why-card{padding:32px 26px;border:1px solid var(--line-strong);border-radius:14px;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center;transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease,background .3s ease}\n.why-card:hover{transform:translateY(-6px);border-color:rgba(238,106,31,.5);box-shadow:0 16px 40px rgba(0,0,0,.4);background:rgba(238,106,31,.04)}\n.why-card__icon{width:64px;height:64px;border-radius:50%;background:rgba(238,106,31,.12);display:flex;align-items:center;justify-content:center;font-size:30px}\n.why-card__title{font-family:var(--serif);font-weight:600;font-size:20px}\n.why-card__text{margin:0;font-size:14px;line-height:1.6;color:var(--muted)}\n\n/* ---------- KONTAKT ---------- */\n.contact__grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;max-width:1100px;margin:0 auto}\n.contact__title{font-family:var(--serif);font-weight:600;font-size:42px;margin:0 0 24px;letter-spacing:-.01em}\n.contact__sub{font-size:16px;line-height:1.7;color:#c3bdae;margin:0 0 30px}\n.contact__list{display:flex;flex-direction:column;gap:18px}\n.contact__label{font-size:12px;letter-spacing:.1em;color:var(--muted);margin-bottom:3px}\n.contact__value{font-size:16px;color:var(--text)}\n.contact__map{border:1px solid var(--line-strong);border-radius:16px;overflow:hidden;background:var(--panel);min-height:420px;display:flex;cursor:zoom-in}\n.contact__map img{width:100%;height:100%;object-fit:cover}\n\n/* ---------- FOOTER ---------- */\n.footer{padding:44px;border-top:1px solid var(--line);background:var(--panel);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px}\n.footer img{height:46px;width:auto}\n.footer__social{display:flex;align-items:center;gap:12px}\n.footer__social a{width:42px;height:42px;border-radius:11px;border:1px solid rgba(242,239,230,.14);display:flex;align-items:center;justify-content:center;color:#cfc9bb;transition:background .25s ease,color .25s ease,border-color .25s ease}\n.footer__social a:hover{background:var(--accent);color:var(--bg);border-color:var(--accent)}\n.footer__copy{font-size:13px;color:var(--dim)}\n\n/* ---------- PLUTAJUĆI BOX + BACK TO TOP ---------- */\n.floatbox{position:fixed;right:24px;bottom:92px;z-index:900;display:flex;align-items:center;gap:14px;padding:16px 18px;max-width:340px;background:linear-gradient(150deg,#1c1a14,#100f0c);border:1px solid rgba(238,106,31,.4);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.55);animation:floatBox 4s ease-in-out infinite}\n.floatbox.is-hidden{display:none}\n.floatbox__icon{flex:none;width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;animation:phonePulse 2.4s ease-in-out infinite}\n.floatbox__body{flex:1;min-width:0}\n.floatbox__title{font-weight:700;font-size:14px;color:var(--text);margin-bottom:3px}\n.floatbox__body a{font-size:15px;font-weight:700;color:var(--accent)}\n.floatbox__body a:hover{color:var(--accent-hover)}\n.floatbox__close{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(242,239,230,.1);color:#cfc9bb;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}\n.floatbox__close:hover{background:var(--accent);color:var(--bg)}\n.backtotop{position:fixed;right:24px;bottom:24px;z-index:901;width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px rgba(0,0,0,.45);transition:transform .25s ease,background .25s ease}\n.backtotop:hover{transform:translateY(-4px);background:var(--accent-hover);color:var(--bg)}\n\n/* ---------- LIGHTBOX (mapa) ---------- */\n.lightbox{position:fixed;inset:0;z-index:9999;background:rgba(12,11,8,.92);display:none;align-items:center;justify-content:center;padding:40px;cursor:zoom-out}\n.lightbox.is-open{display:flex}\n.lightbox img{max-width:95%;max-height:95%;object-fit:contain;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.6)}\n.lightbox__close{position:absolute;top:24px;right:28px;width:44px;height:44px;border-radius:50%;background:rgba(242,239,230,.12);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer}\n.lightbox__close:hover{background:var(--accent);color:var(--bg)}\n\n/* ---------- SCROLL REVEAL (dodaje se JS-om; bez JS-a sve je vidljivo) ---------- */\n.js .reveal{opacity:0;transform:translateY(34px);transition:opacity .7s cubic-bezier(.22,.61,.36,1),transform .7s cubic-bezier(.22,.61,.36,1)}\n.js .reveal.is-in{opacity:1;transform:translateY(0)}\n\n/* ===========================================================\n   STRANICA: UTISCI KANDIDATA\n   =========================================================== */\n.uk-header{display:flex;align-items:center;justify-content:space-between;padding:16px 44px;border-bottom:1px solid var(--line)}\n.uk-header img{height:50px;width:auto}\n.uk-intro{text-align:center;padding:56px 44px 30px}\n.uk-intro h1{font-family:var(--serif);font-weight:600;font-size:48px;margin:0 0 14px;letter-spacing:-.01em}\n.uk-intro p{font-size:17px;color:#c3bdae;max-width:560px;margin:0 auto;line-height:1.6}\n.uk-carousel{padding:20px 44px 40px;max-width:1120px;margin:0 auto}\n.uk-carousel__row{position:relative;display:flex;align-items:center;gap:20px}\n.uk-arrow{flex:none;width:54px;height:54px;border-radius:50%;background:rgba(242,239,230,.06);border:1px solid rgba(242,239,230,.2);display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;color:var(--text)}\n.uk-arrow:hover{background:var(--accent);color:var(--bg)}\n.uk-card{flex:1;position:relative;border-radius:20px;border:1px solid rgba(238,106,31,.3);background:linear-gradient(160deg,#1b1913,#100f0c);box-shadow:0 30px 70px rgba(0,0,0,.55);padding:60px 64px;min-height:320px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}\n.uk-card__mark{position:absolute;top:24px;left:44px;font-family:var(--serif);font-size:120px;line-height:1;color:rgba(238,106,31,.18)}\n.uk-slide{position:relative}\n.uk-slide__stars{color:var(--accent);font-size:16px;letter-spacing:4px;margin-bottom:18px}\n.uk-slide__quote{font-family:var(--serif);font-size:30px;line-height:1.4;margin:0 0 22px;max-width:820px}\n.uk-slide__who{display:flex;align-items:center;gap:14px}\n.uk-slide__who .avatar{width:48px;height:48px;font-size:18px}\n.uk-slide__name{font-weight:700;font-size:17px}\n.uk-slide__cat{font-size:14px;color:var(--accent)}\n.uk-dots{display:flex;gap:10px;justify-content:center;margin-top:20px}\n.uk-dot{width:9px;height:9px;border-radius:50%;cursor:pointer;transition:.3s;background:rgba(242,239,230,.35)}\n.uk-dot.is-active{background:var(--accent);transform:scale(1.25)}\n.uk-cards{padding:40px 44px 80px;max-width:1120px;margin:0 auto}\n.uk-cards h2{font-family:var(--serif);font-weight:600;font-size:30px;margin:0 0 28px;letter-spacing:-.01em}\n.uk-cards__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}\n.uk-cta{text-align:center;margin-top:44px}\n@media (max-width:640px){\n  .uk-header{padding:14px 18px}\n  .uk-intro{padding:40px 20px 22px}\n  .uk-intro h1{font-size:30px;line-height:1.12}\n  .uk-carousel{padding:16px 18px 30px}\n  .uk-carousel__row{gap:8px}\n  .uk-arrow{width:38px;height:38px;font-size:20px}\n  .uk-card{padding:36px 24px;min-height:0}\n  .uk-card__mark{font-size:70px;left:20px;top:14px}\n  .uk-slide__quote{font-size:21px}\n  .uk-cards{padding:24px 18px 60px}\n  .uk-cards h2{font-size:24px}\n  .uk-cards__grid{grid-template-columns:1fr}\n}\n\n/* ===========================================================\n   ANIMACIJE\n   =========================================================== */\n@keyframes logoShine{0%{left:-75%}55%{left:130%}100%{left:130%}}\n@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}\n@keyframes aboutShine{0%{left:-60%}45%{left:120%}100%{left:120%}}\n@keyframes phonePulse{0%{box-shadow:0 0 0 0 rgba(238,106,31,.5)}70%{box-shadow:0 0 0 10px rgba(238,106,31,0)}100%{box-shadow:0 0 0 0 rgba(238,106,31,0)}}\n@keyframes titleShine{0%{background-position:120% center}60%,100%{background-position:-20% center}}\n@keyframes floatBox{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}\n@keyframes lineFill{0%{width:0}70%{width:85.8%}100%{width:85.8%}}\n@keyframes stepPulse{0%{box-shadow:0 0 0 0 rgba(238,106,31,.55);transform:scale(1)}12%{box-shadow:0 0 0 12px rgba(238,106,31,0);transform:scale(1.14)}26%,100%{box-shadow:0 0 0 0 rgba(238,106,31,0);transform:scale(1)}}\n\n/* ===========================================================\n   MOBILNI (<=640px)\n   =========================================================== */\n@media (max-width:640px){\n  .section{padding:52px 20px}\n  .h2,.contact__title{font-size:26px}\n  .hero{grid-template-columns:1fr}\n  .hero__text{padding:36px 20px}\n  .hero__title{font-size:32px;line-height:1.1}\n  .hero__media{padding:0 20px 32px;justify-content:center}\n  .hero__frame img{height:auto;max-height:230px;object-fit:contain}\n  .btn{font-size:12.5px;padding:12px 14px}\n\n  .nav{padding:12px 16px}\n  .nav__links,.nav__right{display:none}\n  .hamburger{display:flex}\n\n  .stats__row{flex-wrap:nowrap}\n  .stats__item{flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 8px}\n  .stats__num{font-size:22px}\n  .stats__label{font-size:10px;text-align:center}\n\n  .cats__grid,.why__grid,.reviews__grid,.faq__grid,.steps,.inst__grid{grid-template-columns:1fr}\n  .cats__head{flex-direction:column;align-items:flex-start;gap:16px}\n  .cat__name{font-size:20px}\n  .cat__desc{font-size:15px;min-height:0}\n\n  .about{display:flex;flex-direction:column}\n  .about__media{order:2;padding:32px 20px}\n  .about__body{order:1;padding:32px 20px}\n\n  .journey__line-bg,.journey__line-fill{display:none}\n  .journey__steps{grid-template-columns:1fr;gap:30px}\n\n  .contact__grid{grid-template-columns:1fr}\n  .contact__map{min-height:260px}\n\n  .floatbox{right:16px;bottom:84px;max-width:calc(100% - 88px)}\n  .backtotop{right:16px;bottom:16px}\n}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n<!-- HEADER -->\n<header class=\"uk-header\">\n  <a href=\"index.html\"><img src=\"3576578a-9224-44ed-b9c3-bc18fd77fd25\" alt=\"Auto škola Motion Temerin\"><\u002Fa>\n<\u002Fheader>\n\n<!-- INTRO -->\n<section class=\"uk-intro\">\n  <div class=\"kicker\">UTISCI KANDIDATA<\u002Fdiv>\n  <h1>Priče onih koji su položili<\u002Fh1>\n  <p>Pravi utisci naših polaznika — pogledaj video svedočanstva i pročitaj iskustva.<\u002Fp>\n<\u002Fsection>\n\n<!-- ISTAKNUTI CAROUSEL -->\n<section class=\"uk-carousel\">\n  <div class=\"uk-carousel__row\">\n    <div class=\"uk-arrow uk-arrow--prev\">‹<\u002Fdiv>\n    <div class=\"uk-card\">\n      <div class=\"uk-card__mark\">“<\u002Fdiv>\n      <div class=\"uk-slide\">\n        <div class=\"uk-slide__stars\">★★★★★<\u002Fdiv>\n        <p class=\"uk-slide__quote\">Položila sam iz prve! Najbolja auto škola u Temerinu — instruktori su vrhunski i uvek strpljivi.<\u002Fp>\n        <div class=\"uk-slide__who\"><div class=\"avatar\">J<\u002Fdiv><div><div class=\"uk-slide__name\">Jelena M.<\u002Fdiv><div class=\"uk-slide__cat\">B kategorija<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"uk-slide\">\n        <div class=\"uk-slide__stars\">★★★★★<\u002Fdiv>\n        <p class=\"uk-slide__quote\">Opuštena atmosfera i maksimalna podrška od prvog časa. Preporuka svima koji se dvoume!<\u002Fp>\n        <div class=\"uk-slide__who\"><div class=\"avatar\">S<\u002Fdiv><div><div class=\"uk-slide__name\">Stefan R.<\u002Fdiv><div class=\"uk-slide__cat\">B kategorija<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"uk-slide\">\n        <div class=\"uk-slide__stars\">★★★★★<\u002Fdiv>\n        <p class=\"uk-slide__quote\">Cela porodica je učila kod Motiona. Profesionalizam i ljubaznost na najvišem nivou.<\u002Fp>\n        <div class=\"uk-slide__who\"><div class=\"avatar\">I<\u002Fdiv><div><div class=\"uk-slide__name\">Porodica Ilić<\u002Fdiv><div class=\"uk-slide__cat\">B kategorija<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"uk-arrow uk-arrow--next\">›<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"uk-dots\">\n    <span class=\"uk-dot is-active\"><\u002Fspan>\n    <span class=\"uk-dot\"><\u002Fspan>\n    <span class=\"uk-dot\"><\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- OSTALI UTISCI -->\n<section class=\"uk-cards\">\n  <h2>Ostali utisci<\u002Fh2>\n  <div class=\"uk-cards__grid\">\n    <div class=\"review\"><div class=\"review__stars\">★★★★★<\u002Fdiv><p class=\"review__quote\">“Profesionalno od upisa do ispita. Sve preporuke za ceo tim!”<\u002Fp><div class=\"review__foot\"><div class=\"avatar\">M<\u002Fdiv><div><div class=\"review__name\">Milica T.<\u002Fdiv><div class=\"review__cat\">A kategorija<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"review\"><div class=\"review__stars\">★★★★★<\u002Fdiv><p class=\"review__quote\">“Fleksibilni termini su mi mnogo značili uz posao. Sve pohvale.”<\u002Fp><div class=\"review__foot\"><div class=\"avatar\">N<\u002Fdiv><div><div class=\"review__name\">Nikola V.<\u002Fdiv><div class=\"review__cat\">B kategorija<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"review\"><div class=\"review__stars\">★★★★★<\u002Fdiv><p class=\"review__quote\">“Strpljivi instruktori — položila sam bez trunke stresa.”<\u002Fp><div class=\"review__foot\"><div class=\"avatar\">T<\u002Fdiv><div><div class=\"review__name\">Teodora S.<\u002Fdiv><div class=\"review__cat\">B kategorija<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"review\"><div class=\"review__stars\">★★★★★<\u002Fdiv><p class=\"review__quote\">“Za C kategoriju najbolji izbor u okolini. Vrhunska obuka.”<\u002Fp><div class=\"review__foot\"><div class=\"avatar\">M<\u002Fdiv><div><div class=\"review__name\">Marko J.<\u002Fdiv><div class=\"review__cat\">C kategorija<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"review\"><div class=\"review__stars\">★★★★★<\u002Fdiv><p class=\"review__quote\">“Brzo, efikasno i korektno. Hvala celom timu na podršci!”<\u002Fp><div class=\"review__foot\"><div class=\"avatar\">I<\u002Fdiv><div><div class=\"review__name\">Ivana P.<\u002Fdiv><div class=\"review__cat\">B kategorija<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"review\"><div class=\"review__stars\">★★★★★<\u002Fdiv><p class=\"review__quote\">“Motori su moja strast — ovde su me sjajno i sigurno obučili.”<\u002Fp><div class=\"review__foot\"><div class=\"avatar\">L<\u002Fdiv><div><div class=\"review__name\">Luka D.<\u002Fdiv><div class=\"review__cat\">A kategorija<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"review\"><div class=\"review__stars\">★★★★★<\u002Fdiv><p class=\"review__quote\">“Prijatna atmosfera i jasno objašnjeni svi detalji. Toplo preporučujem!”<\u002Fp><div class=\"review__foot\"><div class=\"avatar\">A<\u002Fdiv><div><div class=\"review__name\">Anja K.<\u002Fdiv><div class=\"review__cat\">B kategorija<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"review\"><div class=\"review__stars\">★★★★★<\u002Fdiv><p class=\"review__quote\">“Ozbiljan pristup i odlična obuka za teretna vozila. Zadovoljan u potpunosti.”<\u002Fp><div class=\"review__foot\"><div class=\"avatar\">V<\u002Fdiv><div><div class=\"review__name\">Vladimir S.<\u002Fdiv><div class=\"review__cat\">C kategorija<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"review\"><div class=\"review__stars\">★★★★★<\u002Fdiv><p class=\"review__quote\">“Instruktori pun pogodak — strpljivi, ljubazni i uvek dostupni.”<\u002Fp><div class=\"review__foot\"><div class=\"avatar\">S<\u002Fdiv><div><div class=\"review__name\">Sara M.<\u002Fdiv><div class=\"review__cat\">B kategorija<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"review\"><div class=\"review__stars\">★★★★★<\u002Fdiv><p class=\"review__quote\">“Položio iz prve, obuka za motor je bila vrhunska i sigurna.”<\u002Fp><div class=\"review__foot\"><div class=\"avatar\">Đ<\u002Fdiv><div><div class=\"review__name\">Đorđe P.<\u002Fdiv><div class=\"review__cat\">A kategorija<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"review\"><div class=\"review__stars\">★★★★★<\u002Fdiv><p class=\"review__quote\">“Sve pohvale za organizaciju i profesionalnost. Preporuka svima!”<\u002Fp><div class=\"review__foot\"><div class=\"avatar\">M<\u002Fdiv><div><div class=\"review__name\">Milan G.<\u002Fdiv><div class=\"review__cat\">B kategorija<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"review\"><div class=\"review__stars\">★★★★★<\u002Fdiv><p class=\"review__quote\">“Najbolja odluka! Brzo, opušteno i bez stresa do vozačke.”<\u002Fp><div class=\"review__foot\"><div class=\"avatar\">T<\u002Fdiv><div><div class=\"review__name\">Tijana R.<\u002Fdiv><div class=\"review__cat\">B kategorija<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"uk-cta\">\n    <a href=\"index.html#kontakt\" class=\"btn btn--primary\">Prijavi se i ti<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<script src=\"69bee7c8-de82-419a-96c9-63cb5ae9dde7\"><\u002Fscript>\n\n\n
